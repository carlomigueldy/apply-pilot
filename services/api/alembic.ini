# Alembic configuration for ApplyPilot.
#
# The database URL is intentionally left blank here: env.py resolves it at
# runtime from application settings (pydantic-settings), so secrets never live
# in this file.

[alembic]
# Path to migration scripts, relative to this file's directory.
script_location = applypilot/db/migrations

# Template used to generate migration file names; a UTC timestamp prefix keeps
# revisions chronologically sortable on disk.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Use os.pathsep-separated paths; "." prepends the api root so "applypilot.*"
# imports resolve when Alembic is invoked from services/api.
prepend_sys_path = .

# Interpret timestamps in the file_template as UTC.
timezone = UTC

# Max length of the "slug" portion of generated filenames.
truncate_slug_length = 40

# Resolved at runtime in env.py from get_settings().database_url.
sqlalchemy.url =


# ---------------------------------------------------------------------------
# Logging configuration
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
