# ApplyPilot — local production-like stack
# Build context for image builds is the repo root (../.. from this file).
#
# Usage:
#   docker compose -f infra/docker/docker-compose.yml up --build
#
# Service URLs (host):
#   web      http://localhost:3000
#   api      http://localhost:8000  (FastAPI, routes mounted under /api)
#   minio    http://localhost:9000  (S3 API) / http://localhost:9001 (console)

# Shared build definition so `api` and `worker` run the SAME image.
x-api-build: &api-build
  context: ../..
  dockerfile: services/api/Dockerfile

# Shared in-network configuration injected into the Python backend.
# These point at the docker network hostnames; secrets (API keys) come from
# the .env.local file referenced via `env_file` below.
x-api-env: &api-env
  APP_ENV: local
  DATABASE_URL: postgresql+psycopg://applypilot:applypilot@postgres:5432/applypilot
  REDIS_URL: redis://redis:6379/0
  STORAGE_DRIVER: minio
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: applypilot
  MINIO_SECRET_KEY: applypilot123
  MINIO_BUCKET: applypilot
  WEB_URL: http://localhost:3000
  API_URL: http://localhost:8000

services:
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    image: applypilot-web:local
    container_name: applypilot-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - applypilot

  api:
    build: *api-build
    image: applypilot-api:local
    container_name: applypilot-api
    restart: unless-stopped
    command:
      - uvicorn
      - applypilot.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    env_file:
      - path: ../../.env.local
        required: false
    environment:
      <<: *api-env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - applypilot

  worker:
    build: *api-build
    image: applypilot-api:local
    container_name: applypilot-worker
    restart: unless-stopped
    command:
      - python
      - -m
      - applypilot.worker
    env_file:
      - path: ../../.env.local
        required: false
    environment:
      <<: *api-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - applypilot

  postgres:
    image: pgvector/pgvector:pg16
    container_name: applypilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: applypilot
      POSTGRES_PASSWORD: applypilot
      POSTGRES_DB: applypilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applypilot -d applypilot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - applypilot

  redis:
    image: redis:7-alpine
    container_name: applypilot-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - applypilot

  minio:
    image: minio/minio
    container_name: applypilot-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: applypilot
      MINIO_ROOT_PASSWORD: applypilot123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - applypilot

volumes:
  postgres_data:
  minio_data:

networks:
  applypilot:
    driver: bridge
